version: v2
plugins:
  - local: protoc-gen-go
    out: luxirpb
    opt:
      - paths=source_relative
      - Mluxir_types.proto=luxir-hello-world/luxirpb
      - Mluxir.proto=luxir-hello-world/luxirpb
  - local: protoc-gen-go-grpc
    out: luxirpb
    opt:
      - paths=source_relative
      - Mluxir_types.proto=luxir-hello-world/luxirpb
      - Mluxir.proto=luxir-hello-world/luxirpb
