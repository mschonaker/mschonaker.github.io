{{define "style"}}
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c2333; background: #f6f7fb; }
  a { color: #2450b5; text-decoration: none; }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; background: #1c2333; }
  .logo { color: #fff; font-weight: 700; }
  header form { position: relative; display: flex; gap: 8px; flex: 1; max-width: 640px; }
  input[type=search] { flex: 1; padding: 8px 12px; border: 0; border-radius: 6px; font-size: 15px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: #e2554f; color: #fff; font-size: 14px; cursor: pointer; }
  .ta { position: absolute; top: 44px; left: 0; right: 110px; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 10; }
  .ta-box { padding: 10px 14px; }
  .ta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0; }
  .ta-row > b { color: #6c7488; font-size: 12px; text-transform: uppercase; width: 90px; }
  .ta-row a { padding: 3px 8px; border-radius: 6px; background: #eef1f7; color: #1c2333; font-size: 13px; }
  .ta-row a:hover { background: #dde4f2; }
  .ta-item { display: flex; align-items: center; gap: 8px; max-width: 100%; }
  .ta-item img { width: 28px; height: 28px; object-fit: contain; background: #fff; }
  .ta-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
  .ta-item i { color: #6c7488; font-style: normal; }
  .ta-row a span { color: #6c7488; margin-left: 4px; }
  .ta-none { padding: 8px 0; color: #6c7488; }
  .srp { display: flex; gap: 28px; padding: 24px; max-width: 1200px; margin: 0 auto; }
  .facets { width: 240px; flex-shrink: 0; }
  .facets h2 { margin: 0 0 8px; font-size: 15px; }
  .facets h3 { margin: 18px 0 6px; font-size: 13px; color: #6c7488; text-transform: uppercase; }
  .facets ul { list-style: none; margin: 0; padding: 0; }
  .facets li a { display: flex; justify-content: space-between; padding: 3px 6px; border-radius: 5px; color: #1c2333; }
  .facets li a:hover { background: #e6eaf3; }
  .facets li.on a { background: #dce7ff; font-weight: 600; }
  .facets li span { color: #6c7488; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chips a { background: #dce7ff; color: #2450b5; padding: 3px 8px; border-radius: 999px; font-size: 13px; }
  .chips .clear { background: none; color: #e2554f; }
  main { flex: 1; min-width: 0; }
  .meta { margin: 0 0 4px; color: #6c7488; }
  .sorts { margin: 4px 0 16px; display: flex; gap: 10px; }
  .sorts a { font-size: 13px; color: #6c7488; }
  .sorts a.on { color: #2450b5; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; color: #1c2333; box-shadow: 0 1px 3px rgba(28,35,51,.08); }
  .card:hover { box-shadow: 0 4px 12px rgba(28,35,51,.16); }
  .card img { height: 90px; object-fit: contain; }
  .card-title { font-size: 13px; font-weight: 600; }
  .card-brand { font-size: 12px; color: #6c7488; }
  .card-price { font-weight: 700; color: #e2554f; }
  .pager { margin-top: 20px; color: #6c7488; display: flex; gap: 14px; align-items: center; }
  .empty { background: #fff; border-radius: 10px; padding: 40px; text-align: center; color: #6c7488; }
  .pdp { display: flex; gap: 32px; padding: 24px; max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 12px; }
  .pdp img { width: 260px; height: 260px; object-fit: contain; background: #f6f7fb; border-radius: 10px; }
  .pdp h1 { margin: 0 0 8px; font-size: 22px; }
  .pdp .price { font-size: 26px; font-weight: 700; color: #e2554f; }
  .pdp section { margin-top: 14px; color: #40485c; }
  .back { display: inline-block; margin: 18px 24px 0; }
  .crumbs { margin: 18px auto 4px; font-size: 13px; color: #6c7488; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; max-width: 1000px; }
  .crumbs a { color: #6c7488; }
  .crumbs a:hover { color: #2450b5; }
  .crumbs b { color: #1c2333; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 480px; }
</style>
{{end}}
