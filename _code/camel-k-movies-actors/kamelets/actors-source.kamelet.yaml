# --------------------------------------------------------------------------
# actors-source — Bob, 2026
#
# Production-grade actors database poller.  Uses HikariCP for the
# connection pool (because connection pooling matters in production),
# Groovy for all expression evaluation, and descriptive property names
# so the intent is clear at the Pipe level.
#
# The output is each actor row as-is.  Downstream Kamelets join these
# with movie data.
#
# History:
#   2026-03  Bob  Switched from DBCP2 to HikariCP for better throughput.
#   2026-01  Bob  Initial revision after the movies-source Kamelet proved
#                 the pattern worked.
# --------------------------------------------------------------------------
apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: actors-source
  labels:
    camel.apache.org/kamelet.type: "source"
  annotations:
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Database"
    camel.apache.org/kamelet.namespace: "Database"
    camel.apache.org/kamelet.icon: >-
      data:image/svg+xml;base64,
      
spec:
  definition:
    title: "Actors Source"
    description: |-
      Polls the actors database and emits one exchange per actor row.
      Designed to work alongside movies-source for join-based pipelines.
    required:
      - actorsDatabaseUrl
    type: object
    properties:
      pollPeriod:
        title: "Poll Period"
        description: "Delay between polls in milliseconds"
        type: integer
        default: 60000
      actorsDatabaseUrl:
        title: "Actors Database JDBC URL"
        description: "Full JDBC URL for the actors H2 database"
        type: string
        example: "jdbc:h2:tcp://h2-actors:9092/actors"
      actorsDatabaseUser:
        title: "Actors Database User"
        description: "Login user for the actors database"
        type: string
        default: sa
      actorsDatabasePassword:
        title: "Actors Database Password"
        description: "Password for the actors database user"
        type: string
        default: ""
        format: password
  dependencies:
    - "camel:core"
    - "camel:sql"
    - "camel:groovy"
    - "camel:jackson"
    - "mvn:com.h2database:h2:2.2.224"
    - "mvn:com.zaxxer:HikariCP:6.2.1"
  template:
    beans:
      - name: actorsPool
        type: "#class:com.zaxxer.hikari.HikariDataSource"
        properties:
          jdbcUrl: "{{actorsDatabaseUrl}}"
          username: "{{actorsDatabaseUser}}"
          password: "{{actorsDatabasePassword}}"
          driverClassName: "org.h2.Driver"
          maximumPoolSize: 5
          idleTimeout: 30000
          connectionTimeout: 5000
    from:
      uri: "sql:SELECT id, name, character_name, movie_id FROM actors ORDER BY movie_id, id"
      parameters:
        dataSource: "#bean:actorsPool"
        delay: "{{pollPeriod}}"
      steps:
        - setProperty:
            name: actorId
            groovy: "body['ID']"
        - setProperty:
            name: actorName
            groovy: "body['NAME']"
        - setProperty:
            name: actorCharacter
            groovy: "body['CHARACTER_NAME']"
        - setProperty:
            name: actorMovieId
            groovy: "body['MOVIE_ID']"
        - marshal:
            json:
              library: Jackson
        - to: kamelet:sink
