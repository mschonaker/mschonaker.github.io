# ---------------------------------------------------------------------------
# elasticsearch-index-sink — pre-existing infrastructure
#
# This is the standard Camel K Elasticsearch Index Sink Kamelet, cleaned
# of the empty-step bug that ships with Camel K 2.10.1.
#
# It is part of the cluster's pre-existing infrastructure — deployed
# before any pipeline Kamelets are applied.  The Pipe references it as a
# sink; it does not need to be re-deployed per pipeline.
# ---------------------------------------------------------------------------
apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  annotations:
    camel.apache.org/kamelet.group: ElasticSearch
    camel.apache.org/kamelet.namespace: Search
    camel.apache.org/provider: Apache Software Foundation
  labels:
    camel.apache.org/kamelet.type: sink
  name: elasticsearch-index-sink
spec:
  definition:
    description: "Stores JSON-formatted data into ElasticSearch.\n\nThe input data\
      \ must be formatted in JSON according to the requirements of the index. \n\n\
      If you specify the `certificate` property, you must base64 encode it before\
      \ you pass it as a parameter.\n\nIn the header, you can set the following properties:\n\
      \n- `indexId` / `ce-indexid`: The index ID for ElasticSearch.\n\n- `indexName`\
      \ / `ce-indexname`: The index name for ElasticSearch.\n\nIf you do not set a\
      \ property in the header, the Kamelet uses the exchange ID for the index setting."
    properties:
      certificate:
        description: The Certificate for accessing the Elasticsearch cluster. You
          must encode this value in base64.
        title: Certificate
        type: string
      clusterName:
        description: The name of the ElasticSearch cluster.
        example: quickstart
        title: ElasticSearch Cluster Name
        type: string
      enableSSL:
        default: true
        description: Specifies to connect by using SSL.
        title: Enable SSL
        type: boolean
      hostAddresses:
        description: A comma-separated list of remote transport addresses in `ip:port
          format`.
        example: quickstart-es-http:9200
        title: Host Addresses
        type: string
      indexName:
        description: The name of the ElasticSearch index.
        example: data
        title: Index in ElasticSearch
        type: string
      password:
        description: The password to connect to ElasticSearch.
        format: password
        title: Password
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      user:
        description: The username to connect to ElasticSearch.
        title: Username
        type: string
        x-descriptors:
        - urn:camel:group:credentials
    required:
    - clusterName
    - hostAddresses
    title: ElasticSearch Index Sink
    type: object
  dependencies:
  - camel:core
  - camel:jackson
  - camel:kamelet
  - camel:elasticsearch
  - camel:gson
  - camel:bean
  template:
    beans:
    - name: local-es
      properties:
        password: '{{?password}}'
        user: '{{?user}}'
      type: '#class:org.apache.camel.component.es.ElasticsearchComponent'
    from:
      steps:
      - choice:
          when:
          - simple: ${header[indexId]}
            steps:
            - setHeader:
                name: indexId
                simple: ${header[indexId]}
          - simple: ${header[ce-indexid]}
            steps:
            - setHeader:
                name: indexId
                simple: ${header[ce-indexid]}
      - choice:
          when:
          - simple: ${header[indexName]}
            steps:
            - setHeader:
                name: indexName
                simple: ${header[indexName]}
          - simple: ${header[ce-indexname]}
            steps:
            - setHeader:
                name: indexName
                simple: ${header[ce-indexname]}
      - to:
          parameters:
            certificatePath: base64:{{?certificate}}
            enableSSL: '{{enableSSL}}'
            hostAddresses: '{{hostAddresses}}'
            indexName: '{{?indexName}}'
            operation: INDEX
          uri: '{{local-es}}:{{clusterName}}'
      uri: kamelet:source
  types:
    in:
      mediaType: application/json
    out:
      mediaType: text/plain
